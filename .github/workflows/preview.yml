name: Preview

on:
  pull_request:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare:
    name: Cloudflare preview
    runs-on: ubuntu-latest
    # Forks do not get secrets, and the job is pointless without them. Skipping keeps the
    # PR green rather than showing a red check nobody can fix.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_ACCOUNT_ID != ''
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # A version is uploaded but not promoted, so main keeps serving whatever it served.
      # The alias is derived from the PR number, so the URL is stable across pushes and the
      # comment below stays valid instead of accumulating dead links.
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} — ${{ github.sha }}" \
            | tee upload.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' upload.log | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        if: steps.upload.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.upload.outputs.url) }};
            const marker = '<!-- cloudflare-preview -->';
            const body = [
              marker,
              `### Preview`,
              ``,
              `${url}`,
              ``,
              `Built from ${context.sha.slice(0, 7)}. Uploaded as a version, not deployed —`,
              `production is untouched.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
