name: Preview comment

# Cloudflare's Workers Builds integration reports the preview URL in the check run's
# summary, not as a PR comment (that is a Pages behaviour). This mirrors it into a comment
# so the link is on the conversation tab rather than two clicks into the build.
on:
  check_run:
    types: [completed]

jobs:
  mirror:
    if: startsWith(github.event.check_run.name, 'Workers Builds:')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.check_run;
            const summary = run.output?.summary ?? '';

            // "Preview Alias URL: https://…" is the stable per-branch one; fall back to the
            // per-version URL when there is no alias.
            const alias = summary.match(/Preview Alias URL:\s*(https:\/\/\S+)/)?.[1];
            const versioned = summary.match(/Preview URL:\s*(https:\/\/\S+)/)?.[1];
            const url = alias ?? versioned;
            if (!url) return core.info('No preview URL in the check summary; nothing to mirror.');

            const pr = run.pull_requests?.[0];
            if (!pr) return core.info('Check run is not attached to a pull request.');

            const marker = '<!-- cloudflare-preview -->';
            const body = [
              marker,
              `**Preview** · ${url}`,
              '',
              `<sub>${run.conclusion === 'success' ? 'Built' : `Build ${run.conclusion}`} from ${context.payload.check_run.head_sha.slice(0, 7)}.`
                + (alias && versioned && alias !== versioned ? ` This version: ${versioned}` : '')
                + '</sub>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }
